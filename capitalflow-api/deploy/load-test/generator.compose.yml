services:
  load-generator:
    build:
      context: ../..
      dockerfile: deploy/load-test/Dockerfile.generator
    env_file:
      - ${CAPITALFLOW_LOADTEST_GENERATOR_ENV:-.env.generator}
    command: ["--stages", "100,150,200,300,400,500", "--duration", "30", "--warmup", "5", "--cooldown", "10", "--stage-drain-timeout", "90", "--seed-transactions", "20000"]
    volumes:
      - ../../artifacts/load-tests:/app/artifacts/load-tests
